apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
spec:
  serviceName: "billing-app"
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
      - name: billing-app
        image: malang27/billing-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: BILLING_PORT
          value: "8080"
        - name: BILLING_DB_HOST
          value: "billing-db-0.billing-db.default.svc.cluster.local"
        - name: BILLING_DB_PORT
          value: "5432"
        - name: BILLING_DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: BILLING_DB_NAME
        - name: BILLING_DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: BILLING_DB_USER
        - name: BILLING_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: BILLING_DB_PASSWORD
        - name: RABBITMQ_HOST
          value: "rabbitmq.default.svc.cluster.local"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_QUEUE
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
