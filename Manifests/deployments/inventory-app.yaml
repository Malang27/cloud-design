apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 1  # HPA will manage this
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
      - name: inventory-app
        image: malang27/inventory-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: INVENTORY_PORT
          value: "8080"
        - name: INVENTORY_DB_HOST
          value: "inventory-db-0.inventory-db.default.svc.cluster.local"
        - name: INVENTORY_DB_PORT
          value: "5432"
        - name: INVENTORY_DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: INVENTORY_DB_NAME
        - name: INVENTORY_DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: INVENTORY_DB_USER
        - name: INVENTORY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: INVENTORY_DB_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
